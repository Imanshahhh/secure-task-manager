<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f11;
      --surface: #18181c;
      --border: #2a2a30;
      --accent: #c8f060;
      --accent-dim: rgba(200,240,96,0.12);
      --text: #e8e8ec;
      --muted: #6b6b78;
      --danger: #ff5c5c;
      --warning: #f0a832;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Navbar ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15,15,17,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 58px;
    }

    .nav-brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-brand span {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-links a {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
    }

    .nav-links a:hover {
      color: var(--text);
      background: rgba(255,255,255,0.06);
    }

    .nav-links a.logout {
      color: var(--danger);
      margin-left: 8px;
      border: 1px solid rgba(255,92,92,0.2);
    }

    .nav-links a.logout:hover {
      background: rgba(255,92,92,0.1);
      color: var(--danger);
    }

    /* ── Messages ── */
   .messages {
      position: fixed;
      top: 70px;
      right: 24px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 999;
   }
    .message {
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      border: 1px solid;
      animation: slideIn 0.3s ease both;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.success {
      background: rgba(200,240,96,0.1);
      border-color: rgba(200,240,96,0.25);
      color: var(--accent);
    }

    .message.error {
      background: rgba(255,92,92,0.1);
      border-color: rgba(255,92,92,0.25);
      color: var(--danger);
    }

    .message.warning {
      background: rgba(240,168,50,0.1);
      border-color: rgba(240,168,50,0.25);
      color: var(--warning);
    }

    .message.info {
      background: rgba(100,180,255,0.1);
      border-color: rgba(100,180,255,0.25);
      color: #64b4ff;
    }

    /* ── Main content ── */
    main {
      min-height: calc(100vh - 58px);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ── Selection ── */
    ::selection { background: var(--accent-dim); color: var(--accent); }
  </style>
</head>
<body>

{% if user.is_authenticated %}
<nav>
  <a href="{% url 'dashboard' %}" class="nav-brand">
    <span></span> TaskManager
  </a>
  <div class="nav-links">
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'profile' %}">Profile</a>
    {% if user.is_staff %}
    <a href="{% url 'audit_log' %}">Audit Log</a>
    {% endif %}
    <a href="{% url 'logout' %}" class="logout">Logout</a>
  </div>
</nav>
{% endif %}

{% if messages and request.resolver_match.url_name != 'login' %}
<div class="messages">
  {% for message in messages %}
  <div class="message {{ message.tags }}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}

<main>
  {% block content %}{% endblock %}
</main>

</body>
</html>
