{% extends 'main/base.html' %}

{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap');

  :root {
    --bg: #0f0f11;
    --accent: #ff5c5c;
    --accent-dim: rgba(255,92,92,0.1);
    --text: #e8e8ec;
    --muted: #6b6b78;
    --border: #2a2a30;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .error-page {
    text-align: center;
    padding: 40px 24px;
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .error-code {
    font-family: 'Syne', sans-serif;
    font-size: clamp(7rem, 20vw, 12rem);
    font-weight: 800;
    letter-spacing: -0.05em;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 2px var(--border);
    margin-bottom: 8px;
    position: relative;
  }

  .error-code span {
    color: var(--accent);
    -webkit-text-stroke: 0;
  }

  .error-label {
    font-family: 'Syne', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .error-desc {
    font-size: 0.95rem;
    color: var(--muted);
    margin-bottom: 36px;
    max-width: 340px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
  }

  .error-note {
    display: inline-block;
    background: var(--accent-dim);
    border: 1px solid rgba(255,92,92,0.2);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.8rem;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    margin-bottom: 32px;
    letter-spacing: 0.03em;
  }

  .btn-home {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #e8e8ec;
    color: #0f0f11;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 13px 28px;
    border-radius: 10px;
    text-decoration: none;
    transition: opacity 0.15s, transform 0.15s;
  }

  .btn-home:hover {
    opacity: 0.88;
    transform: translateY(-2px);
  }

  /* subtle pulse on the 500 */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .error-code span { animation: pulse 2.4s ease-in-out infinite; }
</style>

<div class="error-page">
  <div class="error-code"><span>5</span>0<span>0</span></div>
  <h1 class="error-label">Server Error</h1>
  <p class="error-desc">
    Something went wrong on our end. We're aware of the issue and working to fix it.
  </p>
  <div class="error-note">Internal Server Error — Please try again later</div>
  <br>
  <a href="{% url 'dashboard' %}"class="btn-home">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M3 8l5-5 5 5M8 3v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Go Back Home
  </a>
</div>
{% endblock %}
